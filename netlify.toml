headers = []

# ---------------------------------------------------------------------------
# Staging protection.
# Branch deploys and deploy previews are served noindex,nofollow,noarchive at
# the HTTP level. These contexts NEVER apply to the production context, so this
# protection cannot leak to goldmarinesolutions.com.
# The pages on the staging branch also carry a STAGING-ONLY <meta name="robots">
# tag as a second layer — see the pre-merge checklist in HANDOVER.md.
# ---------------------------------------------------------------------------
[[context.branch-deploy.headers]]
  for = "/*"
  [context.branch-deploy.headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[context.deploy-preview.headers]]
  for = "/*"
  [context.deploy-preview.headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"

# ---------------------------------------------------------------------------
# Local tooling is committed so it cannot be lost, but it is not part of the
# site. publish = "." would otherwise serve it.
# ---------------------------------------------------------------------------
[[redirects]]
  from = "/_tools/*"
  to = "/"
  status = 404
  force = true

# ---------------------------------------------------------------------------
# 301 redirects for removed suburb pages.
# These four suburb pages were real URLs on the live site and still carry index
# presence, so the 301s must land somewhere real. The Service Areas page was
# removed at the owner's request, so they point back at the homepage #areas
# section — which is exactly where production sends them today.
# No suburb or marina pages in any phase.
# ---------------------------------------------------------------------------
[[redirects]]
  from = "/coomera.html"
  to = "/#areas"
  status = 301
  force = true

[[redirects]]
  from = "/hope-island.html"
  to = "/#areas"
  status = 301
  force = true

[[redirects]]
  from = "/runaway-bay.html"
  to = "/#areas"
  status = 301
  force = true

[[redirects]]
  from = "/southport.html"
  to = "/#areas"
  status = 301
  force = true

# NOTE: /membership.html, /links.html, /privacy.html and / have NO redirects.
# Their URLs are unchanged and must stay that way — MASTER-SITEMAP-v3.2 §2.

[functions]

  [functions.emails]
  included_files = [
    "./emails/**"
  ]

  [functions."*"]

[[plugins]]
origin = "ui"
package = "@netlify/plugin-emails"
pinned_version = "1"

  [plugins.inputs]

[build]
publish = "."
publishOrigin = "default"

  [build.environment]

  [build.processing]

    [build.processing.css]

    [build.processing.html]

    [build.processing.images]

    [build.processing.js]

  [build.services]
