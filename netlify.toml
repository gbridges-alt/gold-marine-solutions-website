headers = []
redirects = []

# 301 redirects for removed suburb pages — preserves SEO and avoids 404s
[[redirects]]
  from = "/coomera.html"
  to = "/#areas"
  status = 301
  force = true

[[redirects]]
  from = "/hope-island.html"
  to = "/#areas"
  status = 301
  force = true

[[redirects]]
  from = "/runaway-bay.html"
  to = "/#areas"
  status = 301
  force = true

[[redirects]]
  from = "/southport.html"
  to = "/#areas"
  status = 301
  force = true

[functions]

  [functions.emails]
  included_files = [
    "./emails/**"
  ]

  [functions."*"]

[[plugins]]
origin = "ui"
package = "@netlify/plugin-emails"
pinned_version = "1"

  [plugins.inputs]

[build]
publish = "."
publishOrigin = "default"

  [build.environment]

  [build.processing]

    [build.processing.css]

    [build.processing.html]

    [build.processing.images]

    [build.processing.js]

  [build.services]